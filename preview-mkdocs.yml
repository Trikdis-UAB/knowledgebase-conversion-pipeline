site_name: TRIKDIS Manuals Preview
site_url: http://127.0.0.1:8000
theme:
  name: material
  font: false
  palette:
    primary: custom
  features:
  - navigation.instant
  - navigation.expand
  - search.suggest
  - search.highlight

docs_dir: docs

nav:
  - Home: index.md
  - Converted Manuals:
      - GATOR (2025-10-16): manuals/GATOR_UM_ENG_2025 10 16/index.md
      - GET (2025-09-03): manuals/GET UM_ENG_2025 09 03/index.md
      - GT (2025-09-11): manuals/GT UM_ENG_2025 09 11/index.md
      - GT+ (2025-09-11): manuals/GT+ UM_ENG_2025 09 11/index.md
      - Gator WiFi (2025-03-25): manuals/Gator WiFi_UM_ENG_2025 03 25/index.md
      - SP3 (2025-09-12): manuals/SP3_TAIM_EN_2025 09 12/index.md

plugins:
  - search:
      lang:
        - en
  - add-number:
      order: 2
      strict_mode: false
      excludes:
        - index.md

markdown_extensions:
- attr_list
- admonition
- sane_lists
- tables
- pymdownx.details
- pymdownx.superfences
- markdown_callouts
- toc:
    permalink: true
    permalink_title: Link to this section
